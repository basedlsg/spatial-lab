[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-lab"
version = "1.0.0"
description = "Multi-Agent Warehouse Robotics with LLM Coordination"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Based LSG"}
]
keywords = ["robotics", "multi-agent", "llm", "spatial-reasoning", "warehouse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "atroposlib>=0.2.1",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "transformers>=4.20.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "networkx>=2.6.0",
    "shapely>=2.0.0",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "wandb>=0.12.0",
    "tensorboard>=2.11.0",
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0",
    "configparser>=5.3.0",
    "structlog>=23.1.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/basedlsg/spatial-lab"
Repository = "https://github.com/basedlsg/spatial-lab"
"Bug Tracker" = "https://github.com/basedlsg/spatial-lab/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
